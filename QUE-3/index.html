<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To Do App</title>

    <!-- Vue 3 CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 30px;
        }

        .todo-container {
            width: 400px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        input {
            width: 70%;
            padding: 10px;
        }

        button {
            padding: 10px;
            margin-left: 5px;
            cursor: pointer;
        }

        ul {
            padding: 0;
        }

        li {
            list-style: none;
            padding: 10px;
            margin-top: 8px;
            background-color: #eeeeee;
        }

        .delete-btn {
            float: right;
        }

        .completed {
            text-decoration: line-through;
        }
    </style>

</head>

<body>

    <div id="app">

        <div class="todo-container">

            <h1>To Do App</h1>

            <!-- Add Todo -->
            <input
                type="text"
                v-model="newTodo"
                placeholder="Enter a task"
                @keyup.enter="addTodo"
            >

            <button @click="addTodo">
                Add
            </button>


            <!-- Todo List -->
            <ul>

                <li
                    v-for="(todo, index) in todos"
                    :key="index"
                    :class="{ completed: todo.completed }"
                >

                    <input
                        type="checkbox"
                        v-model="todo.completed"
                    >

                    {{ todo.text }}

                    <button
                        class="delete-btn"
                        @click="deleteTodo(index)"
                    >
                        Delete
                    </button>

                </li>

            </ul>


            <!-- Total Tasks -->
            <p>
                Total Tasks: {{ todos.length }}
            </p>

        </div>

    </div>


    <script>

        const app = Vue.createApp({

            data() {

                return {

                    newTodo: "",

                    todos: []

                };

            },

            methods: {

                // Add new task
                addTodo() {

                    if (this.newTodo.trim() !== "") {

                        this.todos.push({

                            text: this.newTodo,

                            completed: false

                        });

                        this.newTodo = "";

                    }

                },


                // Delete task
                deleteTodo(index) {

                    this.todos.splice(index, 1);

                }

            }

        });


        app.mount("#app");

    </script>

</body>

</html>
